    <main>
        <section class="formulario-contenedor">
            <h1 class="texto-verde">Crear cuenta</h1>
            <p class="texto-verde">Completa el formulario para registrarte</p>

            <form class="row g-3" action="dashboard-huesped.html">

                <div class="col-12 col-md-6">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Ingresa tu Nombre" required>
                </div>

                <div class="col-12 col-md-6">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input type="text" id="apellido" class="form-control" placeholder="Ingresa tu Apellido" required>
                </div>

                <div class="col-12">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text texto-verde"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control" placeholder="correo@gmail.com" required>
                    </div>
                </div>

                <div class="col-12">
                    <label for="telefono" class="form-label">Telefono (Opcional)</label>
                    <div class="input-group">
                        <span class="input-group-text texto-verde"><i class="bi bi-telephone"></i></span>
                        <input type="tel" id="telefono" class="form-control" placeholder="3512 124321">
                    </div>
                </div>

                <div class="col-12 col-md-6">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text texto-verde"><i class="bi bi-lock"></i></span>
                        <input type="password" id="contrasena" class="form-control" placeholder="Minimo 8 Caracteres" required>
                    </div>
                </div>

                <div class="col-12 col-md-6">
                    <label for="confirmar-contrasena" class="form-label">Confirmar Contraseña</label>
                                        <div class="input-group">
                        <span class="input-group-text texto-verde"><i class="bi bi-lock"></i></span>
                        <input type="password" id="confirmar-contrasena" class="form-control" placeholder="Repeti tu Contraseña" required>
                    </div>
                </div>

                <div class="col-12">
                    <a routerLink="/login" class="btn boton-uno w-100">Registrarse</a>
                </div>

            </form>

            <p class="mt-3 texto-verde">¿Ya tenes cuenta? <a routerLink="/login">Inicia Sesion aca.</a></p>
        </section>

    </main>
