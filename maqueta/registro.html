<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Aires de las Sierras</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="menu">
            <h1>Aires de las Sierras</h1>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login.html">Iniciar Sesion</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="formulario-contenedor">
            <h2>Crear cuenta</h2>
            <p>Completa el formulario para registrarte</p>

            <form class="formulario">>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Ingresa tu Nombre" required>

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" placeholder="Ingresa tu Apellido" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="correo@gmail.com" required>

                <label for="telefono">Telefono (Opcional)</label>
                <input type="number" id="telefono" placeholder="3512 124321">

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" placeholder="Minimo 8 Caracteres" required>

                <label for="confirmar-contrasena">Confirmar Contraseña</label>
                <input type="password" id="confirmar-contrasena" placeholder="Repeti tu Contraseña" required>

                <button type="submit">Registrarse</button>
            </form>

            <p>¿Ya tenes cuenta? <a href="login.html">Inicia Sesion aca.</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Aires de las Sierras - Todos los derechos reservados</p>
    </footer>
</body>
</html>
