<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Aires de las Sierras</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>

        <h1 class="visually-hidden">Aires de las Sierras</h1>

        <nav class="navbar navbar-expand-md">
            <div class="container-fluid">

                <a class="navbar-brand" href="index.html">
                    Aires de las Sierras
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuNav"
                        aria-controls="menuNav"
                        aria-expanded="false"
                        aria-label="Abrir menú de navegación">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="menuNav">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="login.html">Login</a>
                        </li>

                    </ul>

                </div>

            </div>
        </nav>

    </header>


    <main class="container py-4">

        <section class="formulario-contenedor">
            <h2>Crear cuenta</h2>
            <p>Completa el formulario para registrarte</p>

            <form class="row g-3" action="dashboard-huesped.html">

                <div class="col-12 col-md-6">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Ingresa tu Nombre" required>
                </div>

                <div class="col-12 col-md-6">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input type="text" id="apellido" class="form-control" placeholder="Ingresa tu Apellido" required>
                </div>

                <div class="col-12">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="correo@gmail.com" required>
                </div>

                <div class="col-12">
                    <label for="telefono" class="form-label">Telefono (Opcional)</label>
                    <input type="number" id="telefono" class="form-control" placeholder="3512 124321">
                </div>

                <div class="col-12 col-md-6">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" id="contrasena" class="form-control" placeholder="Minimo 8 Caracteres" required>
                </div>

                <div class="col-12 col-md-6">
                    <label for="confirmar-contrasena" class="form-label">Confirmar Contraseña</label>
                    <input type="password" id="confirmar-contrasena" class="form-control" placeholder="Repeti tu Contraseña" required>
                </div>

                <div class="col-12">
                    <a href="login.html" class="btn btn-principal w-100">Registrarse</a>
                </div>

            </form>

            <p class="mt-3">¿Ya tenes cuenta? <a href="login.html">Inicia Sesion aca.</a></p>
        </section>

    </main>


    <footer>
        <p>© 2026 Aires de las Sierras - Todos los derechos reservados</p>
    </footer>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
</body>
</html>
