<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Aires de las Sierras</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="img/FaviconAiresDeLasSierras.png">
</head>
<body>


    <header>
        <nav class="navbar navbar-expand-md">
            <div class="container-fluid">

                <a class="navbar-brand" href="index.html">
                    <img src="img/IsotipoAireDeLasSierrasVerde.png" alt="Isotipo de la pagina" class="logo-iso">
                    <img src="img/LogotipoAiresDeLasCierrasVerde.png" alt="Logotipo de la pagina" class="logo-txt">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav"
                    aria-controls="menuNav" aria-expanded="false" aria-label="Abrir menú de navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuNav">
                    <ul class="navbar-nav ms-auto gap-2">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn boton-uno" href="registro.html">Registro</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>



    <main>

        <section class="formulario-contenedor">
            <h1 class="texto-verde">Iniciar Sesión</h1>
            <p class="texto-verde">Accede a tu cuenta para gestionar tus reservas.</p>

            <form class="row g-3" action="dashboard-huesped.html">

                <div class="col-12">
                    <label for="email" class="form-label">Email:</label>
                    <div class="input-group">
                        <span class="input-group-text texto-verde"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control" placeholder="correo@gmail.com" required>
                    </div>
                    
                </div>

                <div class="col-12">
                    <label for="contrasena" class="form-label">Contraseña:</label>
                    <div class="input-group">
                        <span class="input-group-text texto-verde"><i class="bi bi-lock"></i></span>
                        <input type="password" id="contrasena" class="form-control" placeholder="Ingresa tu Contraseña" required>
                    </div>
                </div>
                    

                <div class="col-12">
                    <a href="dashboard-huesped.html" class="btn boton-uno w-100">Iniciar Sesión</a>
                </div>

            </form>

            <p class="mt-3 texto-verde">¿No tenes cuenta? <a href="registro.html">Registrate aca</a></p>
        </section>

    </main>


    <footer>
        <p>© 2026 Aires de las Sierras - Todos los derechos reservados</p>
        <hr>
        <p>Córdoba, Argentina</p>
    </footer>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
</body>
</html>
