<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Aires de las Sierras</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


    <header>

        <h1 class="visually-hidden">Aires de las Sierras</h1>

        <nav class="navbar navbar-expand-md">
            <div class="container-fluid">

                <a class="navbar-brand" href="index.html">
                    Aires de las Sierras
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuNav"
                        aria-controls="menuNav"
                        aria-expanded="false"
                        aria-label="Abrir menú de navegación">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="menuNav">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="registro.html">Registro</a>
                        </li>

                    </ul>

                </div>

            </div>
        </nav>

    </header>



    <main class="container py-4">

        <section class="formulario-contenedor">
            <h2>Iniciar Sesión</h2>
            <p>Ingresa tu email y contraseña para acceder al sistema.</p>

            <form class="row g-3" action="dashboard-huesped.html">

                <div class="col-12">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="correo@gmail.com" required>
                </div>

                <div class="col-12">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" id="contrasena" class="form-control" placeholder="Ingresa tu Contraseña" required>
                </div>

                <div class="col-12">
                    <a href="dashboard-huesped.html" class="btn btn-principal w-100">Iniciar Sesión</a>
                </div>

            </form>

            <p class="mt-3">¿No tenes cuenta? <a href="registro.html">Registrate aca</a></p>
        </section>

    </main>


    <footer>
        <p>© 2026 Aires de las Sierras - Todos los derechos reservados</p>
    </footer>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
</body>
</html>
