<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Aires de las Sierras</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="menu">
            <h1>Aires de las Sierras</h1>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="registro.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="formulario-contenedor">
            <h2>Iniciar Sesion</h2>
            <p>Ingresa tu email y contraseña para acceder al sistema.</p>

            <form class="formulario">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="correo@gmail.com" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" placeholder="Ingresa tu Contraseña" required>
                
                <button type="submit">Iniciar Sesion</button>
            </form>

            <p>¿No tenes cuenta? <a href="registro.html">Registrate aca</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Aires de las Sierras - Todos los derechos reservados</p>
    </footer>
</body>
</html>
